<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#050505"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#1F2937" stroke-width="6"/>
  <circle cx="256" cy="256" r="230" fill="url(#neonGlow)"/>

  <!-- Metronome Frame / Pyramidal body -->
  <polygon points="256,70 140,430 372,430" fill="#111827" stroke="#374151" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="256,105 168,410 344,410" fill="#0A0A0A" stroke="#1E293B" stroke-width="4"/>

  <!-- Scale Ticks -->
  <line x1="210" y1="200" x2="302" y2="200" stroke="#334155" stroke-width="3"/>
  <line x1="195" y1="250" x2="317" y2="250" stroke="#334155" stroke-width="3"/>
  <line x1="180" y1="300" x2="332" y2="300" stroke="#334155" stroke-width="3"/>
  <line x1="165" y1="350" x2="347" y2="350" stroke="#334155" stroke-width="3"/>

  <!-- Swinging Needle -->
  <line x1="256" y1="385" x2="310" y2="120" stroke="url(#needleGrad)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Counterweight -->
  <rect x="288" y="170" width="34" height="24" rx="4" fill="#00FF66" transform="rotate(12 305 182)" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Pivot Base -->
  <circle cx="256" cy="385" r="18" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Glowing MK Badge -->
  <rect x="196" y="440" width="120" height="34" rx="8" fill="#00FF66"/>
  <text x="256" y="464" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">MK LIVE</text>
</svg>
